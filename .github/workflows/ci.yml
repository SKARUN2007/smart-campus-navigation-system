name: CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
      JWT_SECRET: "ci-pipeline-temporary-validation-secret-key"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "production"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute Routing Engine Algorithm Tests
        run: npx tsx scripts/test-routing.ts

      - name: Verify Next.js Production Build
        run: npm run build
